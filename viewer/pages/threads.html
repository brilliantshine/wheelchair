<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads</title>
<link rel="stylesheet" href="/wheelchair/assets/pages/app.css">
<script src="/wheelchair/assets/pages/nav.js" defer></script>
<script src="/wheelchair/assets/pages/threads.js" defer></script>
<header id="app-nav" data-current="threads"></header>
<div class="shell on-index no-side">
  <nav class="col-list" aria-label="Threads">
    <a id="new-toggle" href="/wheelchair/app/new">+ New thread</a>
    <div id="list-error" class="error-banner" hidden></div>
    <label class="list-opts"><input type="checkbox" id="show-archived"> Show archived</label>
    <ul id="list"></ul>
    <p id="empty" class="dim" hidden>No threads yet.</p>
  </nav>
  <main class="col-main">
    <div class="placeholder">
      <h2>Pick a thread</h2>
      <p>Choose one on the left, or start a new one. Each thread is a conversation with a lead session.</p>
    </div>
  </main>
</div>
