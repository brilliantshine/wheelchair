<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/wheelchair/assets/pages/theme-palette.js"></script>
<script src="/wheelchair/assets/pages/theme.js"></script>
<link rel="stylesheet" href="/wheelchair/assets/pages/background.css">
<script src="/wheelchair/assets/pages/background.js" defer></script>
<title>Thread</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f6feb'/><g fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='M14 10v8h7l3 7'/><path d='M14 13.5h5'/><path d='M10.5 15.5a6.5 6.5 0 1 0 9.5 7'/></g><circle cx='14' cy='6' r='2.6' fill='white'/></svg>">
<link rel="stylesheet" href="/wheelchair/assets/pages/app.css">
<link rel="stylesheet" href="/wheelchair/assets/pages/thread.css">
<script src="/wheelchair/assets/tools.js" defer></script>
<script src="/wheelchair/assets/pages/nav.js" defer></script>
<script src="/wheelchair/assets/pages/md.js" defer></script>
<script src="/wheelchair/assets/pages/threads.js" defer></script>
<script src="/wheelchair/assets/pages/diagram.js" defer></script>
<script src="/wheelchair/assets/pages/file.js" defer></script>
<script src="/wheelchair/assets/pages/thread.js" defer></script>
<script src="/wheelchair/assets/pages/aside.js" defer></script>
<header id="app-nav" data-current="threads"></header>
<div class="shell on-thread">
  <nav class="col-list" aria-label="Threads">
    <div class="list-head" id="list-head">
      <a id="new-toggle" href="/wheelchair/app/new">+ New thread</a>
      <button type="button" id="list-collapse" class="col-toggle" aria-controls="list" aria-expanded="true" aria-label="Hide the thread list" title="Hide the thread list">&laquo;</button>
    </div>
    <div id="list-error" class="error-banner" hidden></div>
    <ul id="list"></ul>
    <p id="empty" class="dim" hidden>No threads yet.</p>
    <button type="button" id="show-archived" class="list-archived" aria-pressed="false">Archived</button>
  </nav>
  <main class="col-main">
    <section id="head" class="thread-head"></section>
    <p id="export-reason" class="dim" hidden></p>
    <div id="head-files" class="head-files" hidden><button type="button" id="files-toggle" aria-controls="files-panel" aria-expanded="false">Files (0)</button></div>
    <section id="files-panel" class="files-panel" aria-label="Files" hidden></section>
    <div id="error" class="error-banner" hidden></div>
    <section id="stub-open" class="card" hidden></section>
    <section id="handoff" class="card amber" hidden></section>
    <details id="before-handoff" class="card" hidden><summary>Before the handoff</summary><div id="handoff-history"></div></details>
    <section id="dead" class="card amber" hidden></section>
    <p id="lead-wait" class="card amber lead-wait" role="status" hidden></p>
    <section id="pinned" aria-label="Pinned"></section>
    <div class="chat-wrap">
      <section id="chat" aria-label="Chat"></section>
      <section id="cards"></section>
      <div id="working" class="working" role="status" aria-label="The lead is working" hidden><span class="spinner big" aria-hidden="true"></span><span id="working-label" class="working-label">The lead is working</span></div>
    </div>
    <section id="handoff-retry" class="card amber" hidden></section>
    <form id="composer">
      <button type="button" id="jump-bottom" class="jump-bottom" aria-label="Jump to the latest message" title="Jump to the latest message" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <div class="composer-box">
        <div id="queued-note" class="dim" hidden></div>
        <div id="attachments" class="attachments"></div>
        <div id="attachment-error" class="card-error" role="status"></div>
        <input id="attachment-input" type="file" multiple hidden>
        <div class="send-row">
          <label for="msg" class="sr-only">Message the lead</label>
          <textarea id="msg" disabled rows="2" placeholder="Message the lead"></textarea>
          <button type="button" id="attach" disabled aria-label="Attach files" title="Attach files"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 11.5 12.5 20a6 6 0 0 1-8.5-8.5L13 2.5a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8-8"/></svg></button>
          <button type="submit" class="primary" id="send" disabled aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </button>
        </div>
      </div>
    </form>
  </main>
  <aside class="col-side" aria-label="Files">
    <button type="button" id="side-collapse" class="col-toggle" aria-controls="files" aria-expanded="true" aria-label="Hide the files panel" title="Hide the files panel">&raquo;</button>
    <section id="aside-panel" hidden></section>
    <section id="files" aria-label="Files" hidden></section>
  </aside>
</div>
