<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread</title>
<link rel="stylesheet" href="/wheelchair/assets/pages/app.css">
<link rel="stylesheet" href="/wheelchair/assets/pages/thread.css">
<script src="/wheelchair/assets/pages/nav.js" defer></script>
<script src="/wheelchair/assets/pages/md.js" defer></script>
<script src="/wheelchair/assets/pages/threads.js" defer></script>
<script src="/wheelchair/assets/pages/thread.js" defer></script>
<script src="/wheelchair/assets/pages/aside.js" defer></script>
<header id="app-nav" data-current="threads"></header>
<div class="shell on-thread">
  <nav class="col-list" aria-label="Threads">
    <a id="new-toggle" href="/wheelchair/app/new">+ New thread</a>
    <div id="list-error" class="error-banner" hidden></div>
    <label class="list-opts"><input type="checkbox" id="show-archived"> Show archived</label>
    <ul id="list"></ul>
    <p id="empty" class="dim" hidden>No threads yet.</p>
  </nav>
  <main class="col-main">
    <section id="head" class="thread-head"></section>
    <div id="head-files" class="head-files" hidden></div>
    <div id="error" class="error-banner" hidden></div>
    <section id="stub-open" class="card" hidden></section>
    <section id="dead" class="card amber" hidden></section>
    <p id="lead-wait" class="card amber lead-wait" role="status" hidden></p>
    <section id="pinned" aria-label="Pinned"></section>
    <div class="chat-wrap">
      <section id="chat" aria-label="Chat"></section>
      <section id="cards"></section>
    </div>
    <form id="composer">
      <div class="composer-box">
        <div id="queued-note" class="dim" hidden></div>
        <div class="send-row">
          <label for="msg" class="sr-only">Message the lead</label>
          <textarea id="msg" rows="2" placeholder="Message the lead"></textarea>
          <span class="hint">The lead decides whether this needs a plan.</span>
          <button type="submit" class="primary" id="send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </button>
        </div>
      </div>
    </form>
  </main>
  <aside class="col-side" aria-label="Files">
    <section id="aside-panel" hidden></section>
    <section id="files" aria-label="This thread's files" hidden></section>
  </aside>
</div>
