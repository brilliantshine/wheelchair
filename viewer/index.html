    // button, but only when it's actually true of the current selection, so a
    // plain single or all-unruled selection isn't cluttered with a caveat that
    // doesn't apply to it.
    let hint = '';
    if (effSel.size > 1 && graph) {
      const alreadyRuled = [...effSel].some((id) => {
        const item = findItem(graph, id);
        return item && item.origin !== 'proposed';
      });
      if (alreadyRuled) hint = 'Applies only to unruled items — existing verdicts are left alone.';
    }
    approveBtn.title = hint;
    rejectBtn.title = hint;
  }

  function resizeCanvas() {
    // Same lesson as the CSS comment above: the height has to be set as an
    // explicit pixel attribute, computed fresh on every layout change, or the
    // <svg> collapses to its 150px intrinsic size.
    //
    // The explanation panel is a second thing, besides the topbar, that pushes the canvas's top
    // edge down — measured the same way, off its own real layout box, not a constant, since it
    // has a different height expanded than collapsed and isn't there at all when there's no
    // explanation. Skipping this measurement is exactly the bug the layout inventory in the plan
    // warns about: the canvas would keep starting at the topbar's bottom edge and its top strip
    // would sit buried under the panel.
    const top = topbar.getBoundingClientRect().height || 48;
    const panelH = explainPanel.isConnected ? explainPanel.getBoundingClientRect().height : 0;
    const canvasTop = top + panelH;
    const h = Math.max(200, window.innerHeight - canvasTop);
    const w = window.innerWidth;
    svg.setAttribute('width', String(w));
    svg.setAttribute('height', String(h));
    svg.style.top = canvasTop + 'px';
  }

  function render() {
    if (!graph) return;
    syncExplainPanel();
    resizeCanvas();
    svg.setAttribute('data-zoom', String(view.k));
    sourceEl.textContent = graph.source + (graph.source_detail ? ' · ' + graph.source_detail : '');

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(buildMarkerDefs());

    // Recreated on every render because the clear above just destroyed the last one — this
    // element is never assumed to survive it. What has to survive is labelWidthCache (declared at
    // module scope, beside measureLabelWidth): a label string measured on an earlier render is
    // still a cache hit even though the <text> that produced that measurement is long gone.
    labelMetricEl = el('text', { class: 'label-metric' });
    svg.appendChild(labelMetricEl);

    const root = el('g', { transform: 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')' });
    svg.appendChild(root);

    const nodeById = new Map(graph.nodes.map((n) => [n.id, n]));

    // Every edge's two anchors, computed here in two phases because phase 2 needs every edge's
    // faces already chosen — a bundle can only be spread once its whole membership is known.
    //
    // Phase 1: which faces. A reciprocal pair — some other edge running this one's `to` back to
    // its `from` — tries the same flank before the facing sides (see faceCandidates); two edges
    // sharing the same `from` and `to` are duplicates, not a reciprocal pair, and are told apart
    // by phase 2's slotting below instead. JSON.stringify of the ordered pair, not a joined
    // string: ids are only guaranteed unique within their own collection, not free of whatever
    // separator a plain join would pick.
    const dirSeen = new Set(graph.edges.map((e) => JSON.stringify([e.from, e.to])));
    const faceChoice = new Map(); // edge.id -> [fromFace, toFace], or null for the rectExit fallback
    for (const e of graph.edges) {
      const a = nodeById.get(e.from), b = nodeById.get(e.to);
      if (!a || !b) continue;
      const recip = dirSeen.has(JSON.stringify([e.to, e.from]));
      faceChoice.set(e.id, chooseFaces(a, b, recip));
    }

    // Phase 2: where on the face. Every arrow *end* that landed on a face — a departure from its
    // source, an arrival at its target — is bundled by (node, face); an edge that fell back to
    // rectExit (faceChoice is null) chose no face pair, so there is no bundle for it to join.
    const bundles = new Map();
    const bundleEnd = (nodeId, face, edgeId, otherId, isArrival) => {
      const key = JSON.stringify([nodeId, face]);
      if (!bundles.has(key)) bundles.set(key, []);
      bundles.get(key).push({ edgeId, otherId, isArrival });
    };
    for (const e of graph.edges) {
      const choice = faceChoice.get(e.id);
      if (!choice) continue;
      bundleEnd(e.from, choice[0], e.id, e.to, false);
      bundleEnd(e.to, choice[1], e.id, e.from, true);
    }

    const edgeAnchors = new Map(); // edge.id -> { from: [x,y], to: [x,y] }
    for (const [key, items] of bundles) {
      const [nodeId, face] = JSON.parse(key);
      const n = nodeById.get(nodeId);
      const h = nodeHeight(n);
      // x for a top or bottom face, y for a left or right one — the axis a bundle spreads along.
      const axis = (face === 'top' || face === 'bottom') ? 'x' : 'y';
      // Ordered by the other endpoint's centre along that axis, then by edge id, so two arrows
      // between the same pair of boxes — same axis position on both counts but one — still land
      // in a stable, distinct order.
      items.sort((p, q) => {
        const op = nodeById.get(p.otherId), oq = nodeById.get(q.otherId);
        const vp = axis === 'x' ? op.x + NODE_W / 2 : op.y + nodeHeight(op) / 2;
        const vq = axis === 'x' ? oq.x + NODE_W / 2 : oq.y + nodeHeight(oq) / 2;
        if (vp !== vq) return vp - vq;
        return p.edgeId < q.edgeId ? -1 : p.edgeId > q.edgeId ? 1 : 0;
      });
      // An arrowhead is the thing that needs room, so a bundle carrying any arrival gets the
      // wider pitch even where most of its members are departures.
      let pitch = items.some((it) => it.isArrival) ? EDGE_FAN_IN : EDGE_FAN_OUT;
      const usable = (axis === 'x' ? NODE_W : h) - 2 * FACE_MARGIN;
      const count = items.length;
      if (count > 1 && (count - 1) * pitch > usable) pitch = usable / (count - 1);
      const [cx, cy] = faceAnchor(n, face);
      items.forEach((it, i) => {
        const off = (i - (count - 1) / 2) * pitch;
        const point = axis === 'x' ? [cx + off, cy] : [cx, cy + off];
        const rec = edgeAnchors.get(it.edgeId) || {};
        rec[it.isArrival ? 'to' : 'from'] = point;
        edgeAnchors.set(it.edgeId, rec);
      });
    }

    // Phase 2 slots each anchor by its bundle position alone, with no view of the box it sits
    // beside — chooseFaces already cleared this edge against both boxes, but only for the face
    // pair's *centres*, and a slot offset moves the anchor off that centre. When a face carries
    // more than one arrow (common enough: see the count in PLAN.md §3) the offset can push the
    // moved anchor back into one of the two boxes the face check just cleared it against. Recheck
    // every edge's *final* anchors here, once every bundle has assigned them and before anything
    // is drawn, and drop the entry for any edge whose slotted line crosses either box — dropping
    // it makes renderEdgeGroup take its `anchors === null` branch below, the same fallback an edge
    // already takes when no candidate face pair passes, trimming the real centre-to-centre line
    // with rectExit instead. One pass: this does not re-bundle or re-choose faces, and a dropped
    // edge simply leaves a gap in its former bundles' slot numbering, which is harmless. rectExit
    // cannot cross a box for two disjoint boxes by construction, so it is always a safe landing
    // spot rather than a case that needs its own reasoning here.
    for (const e of graph.edges) {
      const rec = edgeAnchors.get(e.id);
      if (!rec) continue;
      const a = nodeById.get(e.from), b = nodeById.get(e.to);
      if (!a || !b) continue;
      const ra = { x: a.x, y: a.y, w: NODE_W, h: nodeHeight(a) };
      const rb = { x: b.x, y: b.y, w: NODE_W, h: nodeHeight(b) };
      const [x1, y1] = rec.from, [x2, y2] = rec.to;
      if (rectIntersectsSegment(ra, x1, y1, x2, y2) || rectIntersectsSegment(rb, x1, y1, x2, y2)) {
        edgeAnchors.delete(e.id);
      }
    }

    const effSel = effectiveSelectionIds();
    // Resolved fresh against the current graph on every render, never a list captured when the
    // marked-phrase span was built (see buildExplainBody) — a redraw that changed a group's
    // membership has to relight the new set on the very next hover, not whatever it held before.
    const hoverGroup = hoveredGroupId && graph.groups.find((g) => g.id === hoveredGroupId);
    const hoverLit = hoverGroup ? groupLitSet(hoverGroup.nodes, graph) : null;

    // A visible group's boundary and its words want opposite paint orders, so they are two layers,
    // not one. The region layer — one boundary rect per visible group — goes in first, beneath
    // every node, arrow and label below, so a boundary can never paint over anything drawn inside
    // it. The header layer — each group's name, note and only hit target — is built now, while
    // every group's box is cheap to look up, but only appended to `root` once every edge group
    // below has been (see the header-layer comment further down): the final order is region layer,
    // nodes, edges, header layer, label layer.
    const visibleGroups = graph.groups.filter((g) => g.visible === true);
    const groupBoxes = new Map();
    const groupRegionEls = new Map();
    const regionLayer = el('g', { class: 'group-region-layer' });
    for (const group of visibleGroups) {
      const box = visibleGroupBox(group);
      if (!box) continue;
      groupBoxes.set(group.id, box);
      const cls = ['group-region'];
      // Same rule as a node or an edge: dims with everything outside a hovered marked phrase's
      // group, and never for the header's own hover (see attachGroupHeaderGesture), which must
      // never touch this class at all.
      if (hoverGroup && hoverGroup.id !== group.id) cls.push('group-dim');
      const rect = el('rect', {
        class: cls.join(' '), 'data-group': group.id,
        x: box.x, y: box.y, width: box.w, height: box.h, rx: 6,
      });
      groupRegionEls.set(group.id, rect);
      regionLayer.appendChild(rect);
    }
    root.appendChild(regionLayer);

    // Nodes first, edges after: edges are trimmed to each box's boundary, so
    // painting them second never buries a box's own content.
    for (const n of graph.nodes) renderNodeGroup(root, n, effSel, hoverLit);
    // Seeded with every box before any edge label is placed: a label landing on a node is the
    // same collision as two labels landing on each other, just against a fixed element instead
    // of another label, and it is the worse of the two — it hides a box's own words, which are
    // the ones carrying the answer. Whole boxes, so this covers a fork's tag as well: the tag is
    // drawn inside its box, and it is the one place shape itself means something. Kept separate
    // from labelRects below because the two-tier fallback in renderEdgeGroup treats them
    // differently: clearing every box is required even in the fallback tier, clearing another
    // label is not.
    const nodeBoxRects = graph.nodes.map((n) => ({ x: n.x, y: n.y, w: NODE_W, h: nodeHeight(n) }));
    const labelRects = [];

    // Every header's hit rect is measured and pushed into labelRects here, before the edge loop
    // below both fills and reads it (see renderEdgeGroup) — seeding it after that loop had already
    // run would hand a finished search a list nothing reads, and the seeding would silently do
    // nothing. A header's geometry depends only on its group's box, already computed above, never
    // on an edge, so there is nothing to wait for. The <g> built here is not appended to `root`
    // until after the edge loop, though: appending it now would paint headers under every edge,
    // the exact over-painting the header layer exists to avoid.
    const headerLayer = el('g', { class: 'group-header-layer' });
    for (const group of visibleGroups) {
      const box = groupBoxes.get(group.id);
      if (!box) continue;
      renderGroupHeader(headerLayer, group, box, groupRegionEls.get(group.id), hoverGroup, labelRects);
    }

    // Every label's own geometry — its text, background, was-mark and leader line — is appended
    // here instead of into each edge's own g.edge, and this single <g> is appended once, after
    // every edge group below, rather than interleaved with them: appending a label right after its
    // own edge would still leave it under whichever *later* edge's g.edge the DOM happens to place
    // after it (graph.edges order, not paint intent), which is the same over-painting this whole
    // change exists to fix, just moved rather than removed. Painting the whole layer last means no
    // edge's line, regardless of that order, can ever cross a label that isn't its own.
    const labelLayer = el('g', { class: 'label-layer' });
    for (const e of graph.edges) {
      const a = nodeById.get(e.from), b = nodeById.get(e.to);
      if (!a || !b) continue;
      renderEdgeGroup(root, labelLayer, e, a, b, edgeAnchors.get(e.id) || null, effSel, nodeBoxRects, labelRects, hoverLit);
    }
    root.appendChild(headerLayer);
    root.appendChild(labelLayer);

    if (effSel.size === 1) renderDetail(root, [...effSel][0], nodeById);
    renderControlsState(effSel);
  }

  window.addEventListener('resize', () => { if (graph) render(); });

  // ---- pointer gestures ------------------------------------------------------------------
  let dragState = null;
  let panState = null;
  let marqueeState = null;

  function svgLocal(ev) {
    const r = svg.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function startNodeDrag(ev, n) {
    ev.stopPropagation();
    const already = effectiveSelectionIds().has(n.id);
    const ids = already ? [...effectiveSelectionIds()].filter(isNodeId) : [n.id];
    const start = new Map();
    for (const id of ids) {
      const node = findNode(graph, id);
      start.set(id, { x: node.x, y: node.y });
    }
    dragState = { primary: n.id, ids, start, x0: ev.clientX, y0: ev.clientY, moved: false };
    svg.setPointerCapture(ev.pointerId);
  }

  svg.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.node') || ev.target.closest('.edge')) return;
    // Pan is alt-drag or the middle button; the plain background drag is
    // selection (box-select), so the two never collide.
    if (ev.altKey || ev.button === 1) {
      panState = { x0: view.x, y0: view.y, cx: ev.clientX, cy: ev.clientY };
      svg.classList.add('panning');
    } else {
      const p = svgLocal(ev);
      marqueeState = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, shift: ev.shiftKey };
    }
    svg.setPointerCapture(ev.pointerId);
  });

  svg.addEventListener('pointermove', (ev) => {
    if (dragState) {
      if (!dragState.moved && Math.hypot(ev.clientX - dragState.x0, ev.clientY - dragState.y0) > 3) {
        dragState.moved = true;
      }
      if (dragState.moved) {
        const wdx = (ev.clientX - dragState.x0) / view.k;
        const wdy = (ev.clientY - dragState.y0) / view.k;
        for (const id of dragState.ids) {
          const node = findNode(graph, id);
          const s = dragState.start.get(id);
          node.x = s.x + wdx; node.y = s.y + wdy;
        }
        render();
      }
    } else if (panState) {
      view.x = panState.x0 + (ev.clientX - panState.cx);
      view.y = panState.y0 + (ev.clientY - panState.cy);
      render();
    } else if (marqueeState) {
      const p = svgLocal(ev);
      marqueeState.x1 = p.x; marqueeState.y1 = p.y;
      render(); drawMarquee();
    }
  });

  svg.addEventListener('pointerup', (ev) => {
    if (dragState) {
      if (dragState.moved) {
        const positions = [];
        for (const id of dragState.ids) {
          const node = findNode(graph, id);
          node.x = Math.round(node.x); node.y = Math.round(node.y);
          positions.push([id, { x: node.x, y: node.y }]);
        }
        render();
        commitDrag(positions);
      } else {
        // setPointerCapture above retargets the click that would otherwise
        // follow this pointerup to whatever happens to be under the pointer
        // when it is released — not reliably the node — so selection can
        // never be driven by "click". It fires here, on pointerup, and a drag
        // is distinguished from a plain selection purely by whether the
        // pointer moved past the small threshold above.
        pick(dragState.primary, ev.shiftKey);
      }
      dragState = null;
    } else if (panState) {
      panState = null;
      svg.classList.remove('panning');
    } else if (marqueeState) {
      finishMarquee(marqueeState, ev.shiftKey);
      marqueeState = null;
      render();
    }
  });

  function finishMarquee(m, shift) {
    const w = Math.abs(m.x1 - m.x0), h = Math.abs(m.y1 - m.y0);
    if (w < 4 && h < 4) {
      if (!shift) clearSelection();
      return;
    }
    const bx = Math.min(m.x0, m.x1), by = Math.min(m.y0, m.y1);
    if (!shift) { selectedIds = new Set(); impliedRemoved = new Set(); }
    for (const n of graph.nodes) {
      const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
      const sw = NODE_W * view.k, sh = nodeHeight(n) * view.k;
      if (sx < bx + w && sx + sw > bx && sy < by + h && sy + sh > by) selectedIds.add(n.id);
    }
  }

  function drawMarquee() {
    if (!marqueeState) return;
    svg.appendChild(el('rect', {
      id: 'marquee',
      x: Math.min(marqueeState.x0, marqueeState.x1),
      y: Math.min(marqueeState.y0, marqueeState.y1),
      width: Math.abs(marqueeState.x1 - marqueeState.x0),
      height: Math.abs(marqueeState.y1 - marqueeState.y0),
    }));
  }

  function zoomBy(factor, clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const px = (clientX != null ? clientX : r.left + r.width / 2) - r.left;
    const py = (clientY != null ? clientY : r.top + r.height / 2) - r.top;
    const k = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    render();
  }

  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    zoomBy(ev.deltaY < 0 ? 1.1 : 1 / 1.1, ev.clientX, ev.clientY);
  }, { passive: false });

  document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.2));
  document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.2));

  // ---- polling ------------------------------------------------------------------
  // Reload when the content hash differs from the last one this page read or
  // wrote; never on the page's own write, since that write already updated
  // `lastHash` to match. A drag in flight when an agent writes mid-poll is
  // lost — an accepted risk, not a bug to route around.
  async function pollOnce() {
    if (!currentPath) return;
    const result = await getGraph(currentPath);
    if (!result.ok) {
      if (result.status === 404) { showFatal(result); return; }
      pollStatus.hidden = false;
      pollStatus.textContent = 'lost contact with the viewer server — retrying…';
      return;
    }
    pollStatus.hidden = true;
    if (result.hash !== lastHash) {
      graph = result.graph;
      lastHash = result.hash;
      childrenMap = result.children;
      selectedIds = pruneToExisting(selectedIds);
      impliedRemoved = pruneToExisting(impliedRemoved);
      render();
    }
  }

  // ---- boot ------------------------------------------------------------------
  (async function init() {
    resizeCanvas();
    const ok = await loadGraph(currentPath);
    if (ok) renderBreadcrumb();
    setInterval(pollOnce, POLL_MS);
  })();

  // Read-only: the browser suite drives real pointer gestures and only reads
  // state back through this.
  window.__viewer = {
    get hash() { return lastHash; },
    get zoom() { return view.k; },
    get explainExpanded() { return explainExpanded; },
    selection() { return [...effectiveSelectionIds()]; },
    graph() { return graph; },
    // The one entry here that is not a plain read-back. A group's name is measured at 13px while
    // every edge label is measured at 11, through one cache and one hidden element pinned to 11px
    // by CSS — so a size applied as a presentation attribute instead of an inline style measures
    // at the wrong size and silently poisons the entry for any edge label carrying that same
    // string. Neither failure shows up in the rendered picture, and both are what the browser
    // suite checks through this.
    measureLabelWidth(text, size) { return measureLabelWidth(text, size); },
  };
})();
</script>
