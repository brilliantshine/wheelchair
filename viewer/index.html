<!doctype html>
<meta charset="utf-8">
<title>graph viewer</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel-2: #23262d; --line: #2a2f38;
    --ink: #e6e8ec; --dim: #8b929e;
    --proposed: #6b7280; --agreed: #4ea87b; --rejected: #c4645f; --accent: #5b9dd9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }

  #topbar { position: fixed; inset: 0 0 auto 0; height: 48px; z-index: 5; display: flex;
    align-items: center; gap: 14px; padding: 0 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); overflow: hidden; }
  #breadcrumb { display: flex; gap: 2px; align-items: center; overflow: hidden;
    white-space: nowrap; flex-shrink: 1; }
  #breadcrumb .crumb { background: none; border: none; color: var(--dim); font: inherit;
    cursor: pointer; padding: 3px 6px; border-radius: 3px; }
  #breadcrumb .crumb:hover { color: var(--ink); background: var(--panel-2); }
  #breadcrumb .crumb:last-of-type { color: var(--ink); font-weight: 600; }
  #breadcrumb .crumb + .crumb::before { content: '\203a'; margin-right: 6px; color: var(--dim); }
  #source { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #legend { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11px;
    white-space: nowrap; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  #controls { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
  #controls button { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  #controls button:hover:not(:disabled) { background: #2b3542; }
  #controls button:disabled { opacity: .4; cursor: default; }

  #error-banner { position: fixed; left: 14px; right: 14px; top: 56px; z-index: 6;
    padding: 8px 12px; border-radius: 6px; font-size: 12px; background: #3a1f1f;
    border: 1px solid var(--rejected); color: #f2d4d1; }
  #poll-status { position: fixed; left: 14px; bottom: 14px; z-index: 6; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; background: #2a2a1f; border: 1px solid #8a8a4a;
    color: #e6e4c8; }
  #fatal { position: fixed; inset: 48px 0 0 0; z-index: 7; display: flex; align-items: center;
    justify-content: center; color: var(--dim); font-size: 14px; padding: 40px; text-align: center;
    background: var(--bg); }

  /* The `hidden` attribute only hides an element because the UA stylesheet gives it
     display:none, and ANY author display rule beats that — so #fatal's display:flex above left
     an opaque, invisible overlay covering the whole canvas and swallowing every click. The page
     rendered perfectly and could not be used. Invisible to a DOM test, and to reading the
     markup; it took a real browser and a screenshot. Keep this rule above every element that is
     toggled by `hidden`. */
  [hidden] { display: none !important; }

  /* Sits directly under #topbar and pushes the canvas down by its own real height — see
     resizeCanvas, which measures this element exactly the way it measures #topbar. #explain-body's
     height is fixed, not max-height: a max-height that shrinks to fit short text would make the
     canvas start higher for a two-sentence explanation than for a long one, which is exactly the
     "canvas height changes with content length" bug this element exists to avoid. Below
     #error-banner's z-index (6) on purpose — a transient banner is allowed to overlap this panel's
     text, never the other way around. */
  #explain-panel { position: fixed; left: 0; right: 0; top: 48px; z-index: 4;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #explain-toggle { display: flex; align-items: center; gap: 8px; width: 100%;
    background: var(--panel-2); border: none; border-bottom: 1px solid var(--line);
    color: var(--dim); font: inherit; font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; text-align: left; cursor: pointer; padding: 7px 14px; }
  #explain-toggle:hover { color: var(--ink); }
  #explain-toggle .chevron { display: inline-block; font-size: 10px;
    transition: transform .15s ease; }
  #explain-panel.collapsed #explain-toggle .chevron { transform: rotate(-90deg); }
  #explain-body { height: 84px; overflow-y: auto; margin: 0; padding: 10px 14px;
    max-width: 860px; color: var(--ink); font-size: 12.5px; line-height: 1.55;
    white-space: pre-wrap; }

  /* An <svg> left with height:auto falls back to its 150px intrinsic size and
     silently clips everything below it, while the markup stays perfect — a DOM
     test would still pass. The pixel height is set explicitly from JS
     (resizeCanvas, below) on load and on every viewport resize. */
  svg#canvas { position: fixed; top: 48px; left: 0; touch-action: none; cursor: grab;
    display: block; background: var(--bg); }
  svg#canvas.panning { cursor: grabbing; }

  .node .node-box { fill: #21252c; stroke: var(--proposed); stroke-width: 1.5; }
  .node .node-label { fill: var(--ink); font-size: 12.5px; pointer-events: none; }
  .node .node-kind { fill: var(--dim); font-size: 9.5px; letter-spacing: .03em;
    pointer-events: none; text-transform: uppercase; }
  .node .node-fork { fill: #d8b45f; font-size: 9.5px; pointer-events: none;
    text-transform: uppercase; letter-spacing: .03em; }
  .node.selected .node-box { fill: #2b3140; stroke: var(--accent); stroke-width: 2.5; }
  .node.agreed .node-box { stroke: var(--agreed); }
  .node.rejected .node-box { stroke: var(--rejected); stroke-dasharray: 4 3; }
  .node.rejected { opacity: .5; }
  .node.rejected .node-label { text-decoration: line-through; }
  .node { cursor: move; }

  /* Quiet, not alarming: this is information ("an agent reset this"), not an error.
     Same amber as the fork tag and the inferred-edge note — the page's existing
     colour for "worth a second look", not a new warning colour. */
  .was-mark { fill: #d8b45f; opacity: .8; pointer-events: none; }

  .open-child { cursor: pointer; }
  .open-child .open-child-bg { fill: #2c3340; stroke: var(--accent); stroke-width: 1; }
  .open-child .open-child-label { fill: var(--accent); font-size: 9px; pointer-events: none; }
  .open-child.disabled { cursor: default; }
  .open-child.disabled .open-child-bg { stroke: var(--dim); stroke-dasharray: 2 2; }
  .open-child.disabled .open-child-label { fill: var(--dim); }

  .edge .edge-line { fill: none; stroke: var(--proposed); stroke-width: 1.5; }
  .edge[data-kind="sequence"] .edge-line { stroke-dasharray: 3 3; opacity: .85; }
  .edge .edge-band { stroke: transparent; fill: none; cursor: pointer; }
  .edge .edge-handle { fill: var(--proposed); opacity: 0; cursor: pointer; }
  /* The label used to be one of the three ways an edge is reachable through a plain CSS
     descendant selector — hovering it triggered .edge:hover for free because it lived inside
     g.edge. It's in its own layer now (the label-layer <g> built in render(), appended after
     every edge group so a later edge's line can never paint over an earlier edge's label), so
     that descendant match stopped firing. .edge.label-hover is what keeps the handles appearing
     on hover regardless: the label toggles it on this edge's own group from its
     pointerenter/pointerleave (see renderEdgeGroup). */
  .edge:hover .edge-handle, .edge.selected .edge-handle, .edge.label-hover .edge-handle { opacity: .9; }
  .edge.selected .edge-line { stroke: var(--accent); stroke-width: 3; }
  .edge.selected .edge-handle { fill: var(--accent); }
  .edge.agreed .edge-line { stroke: var(--agreed); }
  .edge.agreed .edge-handle { fill: var(--agreed); }
  .edge.rejected .edge-line { stroke: var(--rejected); stroke-dasharray: 4 3; opacity: .5; }
  .edge.rejected .edge-handle { fill: var(--rejected); }

  /* One of the three ways an edge is reachable is its label; pointer-events:none here would
     silently remove that again — a click on the label would fall through to the canvas and start
     a box-select instead, the original bug this rule exists to head off. Standalone rather than
     descendants of .edge because the label no longer lives inside g.edge (see render()), which
     is also why renderEdgeGroup sets verdict and selection state onto the label's own class list
     rather than letting it inherit from an ancestor. */
  .edge-label, .label-metric { font-size: 11px; }
  .edge-label { fill: var(--dim); cursor: pointer; text-anchor: middle; }
  .edge-label.rejected { text-decoration: line-through; }
  .edge-label-bg { fill: #14161a; stroke: var(--line); stroke-width: 1; cursor: pointer; }

  /* The one hidden element that measures real glyph widths (see measureLabelWidth) instead of
     estimating them. visibility:hidden, never display:none — the latter zeroes
     getComputedTextLength(). Its own class, not .edge-label: sharing that class would make it
     count as an extra label in browser.spec.js's per-edge label-count assertion, and match the
     background-rect assertion below, which it would fail for having no background of its own. */
  .label-metric { visibility: hidden; }

  /* Dashed and carries the edge's own verdict colour, same vocabulary as detail-leader further
     down, so a leader reads as belonging to its edge rather than as new chrome. Drawn before the
     label's opaque background in renderEdgeGroup so its dashes never cross the text. */
  .edge-leader { fill: none; stroke: var(--proposed); stroke-width: 1.5; stroke-dasharray: 3 3;
    opacity: .6; pointer-events: none; }
  .edge-leader.agreed { stroke: var(--agreed); }
  .edge-leader.rejected { stroke: var(--rejected); }

  .detail .detail-bg { fill: var(--panel); stroke: var(--line); }
  .detail text { fill: var(--ink); font-size: 11px; }
  .detail .detail-ref { fill: var(--dim); font-family: ui-monospace, SFMono-Regular, monospace; }
  .detail .detail-inferred { fill: #d8b45f; font-style: italic; }
  /* Nothing cleared inside the bounded search, so the panel sits on whatever
     it landed on. It is already opaque and already painted last (see render,
     where renderDetail runs after every node and edge is appended) — this is
     the "read as a layer, not tangled geometry" half: a stroke and shadow
     strong enough that the boundary is unambiguous at a glance. */
  .detail.overlapping .detail-bg { stroke: var(--accent); stroke-width: 2;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .7)); }
  .detail-leader { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 3;
    opacity: .8; pointer-events: none; }

  #marquee { fill: rgba(91, 157, 217, .12); stroke: var(--accent); stroke-width: 1;
    stroke-dasharray: 3 3; }
</style>

<header id="topbar">
  <nav id="breadcrumb"></nav>
  <span id="source"></span>
  <span id="legend">
    <i style="background:var(--agreed)"></i>agreed
    <i style="background:var(--rejected)"></i>rejected
  </span>
  <div id="controls">
    <button id="select-all">select all</button>
    <button id="clear-selection" disabled>clear</button>
    <button id="approve" disabled>approve</button>
    <button id="reject" disabled>reject</button>
    <button id="zoom-out">&minus;</button>
    <button id="zoom-in">+</button>
  </div>
</header>
<div id="error-banner" hidden></div>
<div id="poll-status" hidden></div>
<div id="fatal" hidden></div>
<svg id="canvas"></svg>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const NODE_W = 200, NODE_H = 74;
  // The one place this number is written. All three call sites that wrap a label read it from
  // here rather than carrying their own literal, because a box's tallest possible height has to
  // stay under the row pitch the server lays graphs out at (LAYER_GAP, viewer/server.js) — three
  // independent copies of the same number could drift from each other and from that pitch with
  // nothing to catch it.
  const NODE_LABEL_MAX_LINES = 5;
  const MIN_ZOOM = 0.3, MAX_ZOOM = 2.5;
  const POLL_MS = 1000;

  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  let currentPath = params.get('path') || '';

  const svg = document.getElementById('canvas');
  const topbar = document.getElementById('topbar');
  const breadcrumbNav = document.getElementById('breadcrumb');
  const sourceEl = document.getElementById('source');
  const errorBanner = document.getElementById('error-banner');
  const pollStatus = document.getElementById('poll-status');
  const fatalEl = document.getElementById('fatal');
  const approveBtn = document.getElementById('approve');
  const rejectBtn = document.getElementById('reject');
  const clearBtn = document.getElementById('clear-selection');

  // ---- state ---------------------------------------------------------------
  let graph = null;          // last known-good canonical graph, as read or written
  let lastHash = '';         // hash matching `graph`
  let childrenMap = {};      // { name: exists }
  let trail = [];            // [{path, title}] ancestors, root first
  let view = { x: 0, y: 0, k: 1 };
  let selectedIds = new Set();     // explicitly clicked/boxed/select-all ids
  let impliedRemoved = new Set();  // edges shift-clicked away while both ends stay selected
  let writing = false;
  // Whether the explanation panel is open. Lives only here: not on the graph (a viewing
  // preference isn't part of Collin's positions or the agent's claims) and not in storage
  // (a poll or a navigation into a child graph must not reset it, but a reload must).
  let explainExpanded = true;

  // ---- small helpers ---------------------------------------------------------
  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    if (attrs) for (const k in attrs) {
      if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    }
    return e;
  }
  function deepClone(x) { return JSON.parse(JSON.stringify(x)); }
  function findNode(g, id) { return g.nodes.find((n) => n.id === id); }
  function findEdge(g, id) { return g.edges.find((e) => e.id === id); }
  function findItem(g, id) { return findNode(g, id) || findEdge(g, id); }
  function isNodeId(id) { return !!findNode(graph, id); }
  function dirnameOf(p) { return p.slice(0, p.lastIndexOf('/') + 1); }
  async function safeJson(res) { try { return await res.json(); } catch { return {}; } }

  // `firstLineMaxChars` lets the first line alone wrap narrower than the rest —
  // used when a node has a container badge sitting in the top-right corner, so
  // the label wraps clear of it instead of running underneath.
  function wrapText(label, maxChars, maxLines, firstLineMaxChars) {
    const cap0 = firstLineMaxChars == null ? maxChars : firstLineMaxChars;
    const words = String(label == null ? '' : label).split(/\s+/).filter(Boolean);
    const lines = [''];
    for (const w of words) {
      const i = lines.length - 1;
      const cap = i === 0 ? cap0 : maxChars;
      const attempt = lines[i] ? lines[i] + ' ' + w : w;
      if (attempt.length <= cap) { lines[i] = attempt; continue; }
      if (lines.length < maxLines) { lines.push(w); continue; }
      lines[maxLines - 1] = lines[maxLines - 1].replace(/…$/, '') + '…';
      break;
    }
    return lines;
  }

  function textWithWrap(cls, x, raw, wrapChars, maxLines) {
    const t = el('text', { class: cls, x });
    const lines = wrapText(raw, wrapChars, maxLines);
    lines.forEach((line, i) => {
      const tspan = el('tspan', { x, dy: i === 0 ? 0 : 14 });
      tspan.textContent = line;
      t.appendChild(tspan);
    });
    t._lineCount = lines.length;
    return t;
  }

  // ---- wire ------------------------------------------------------------------
  function graphUrl(path) {
    return '/graph?path=' + encodeURIComponent(path) + '&token=' + encodeURIComponent(token);
  }
  function viewUrl(path) {
    return '/view?path=' + encodeURIComponent(path);
  }
  function rootUrl(path) {
    return '/?path=' + encodeURIComponent(path) + '&token=' + encodeURIComponent(token);
  }

  async function getGraph(path) {
    let res;
    try {
      res = await fetch(graphUrl(path), { cache: 'no-store' });
    } catch (err) {
      return { ok: false, network: true, error: 'network', detail: String((err && err.message) || err) };
    }
    const body = await safeJson(res);
    if (!res.ok) return { ok: false, status: res.status, error: body.error, detail: body.detail };
    return { ok: true, hash: body.hash, graph: body.graph, children: body.children || {} };
  }

  // `mutateFn` expresses the *intent* of a write (a bulk verdict, or a set of
  // final drag positions) against whatever graph object it is handed. On a 409
  // we re-read the current graph and call it again against the fresh base —
  // that is "re-apply pending verdicts to the new base" without ever resending
  // the stale payload the structural check would refuse.
  //
  // A write started while one is already in flight cannot just be dropped: the
  // page would go on showing the moved position (or the applied verdict) while
  // it was never sent, so the person sees a change that isn't on disk. Instead
  // each call is queued and drains one at a time — every call still produces
  // exactly one PUT /view for its own mutateFn, never more, but a second call
  // that arrives mid-write waits for the first to settle instead of vanishing.
  let writeQueue = [];

  function putView(mutateFn) {
    return new Promise((resolve) => {
      writeQueue.push({ mutateFn, resolve });
      drainWriteQueue();
    });
  }

  async function drainWriteQueue() {
    if (writing) return;
    const job = writeQueue.shift();
    if (!job) return;
    writing = true;
    let result;
    try {
      result = await performWrite(job.mutateFn);
    } finally {
      writing = false;
    }
    job.resolve(result);
    if (writeQueue.length) drainWriteQueue();
  }

  async function performWrite(mutateFn) {
    for (let attempt = 0; attempt < 8; attempt++) {
      const base = deepClone(graph);
      mutateFn(base);
      let res;
      try {
        res = await fetch(viewUrl(currentPath), {
          method: 'PUT',
          cache: 'no-store',
          headers: { 'content-type': 'application/json', 'X-Graph-Token': token },
          body: JSON.stringify({ hash: lastHash, graph: base }),
        });
      } catch (err) {
        showErrorBanner({ error: 'network', detail: String((err && err.message) || err) });
        return false;
      }
      if (res.ok) {
        const body = await safeJson(res);
        lastHash = body.hash;
        graph = base;
        selectedIds = pruneToExisting(selectedIds);
        impliedRemoved = pruneToExisting(impliedRemoved);
        clearErrorBanner();
        render();
        return true;
      }
      const body = await safeJson(res);
      if (res.status === 409) {
        const fresh = await getGraph(currentPath);
        if (!fresh.ok) { showFatal(fresh); return false; }
        graph = fresh.graph; lastHash = fresh.hash; childrenMap = fresh.children;
        continue;
      }
      showErrorBanner({ status: res.status, error: body.error, detail: body.detail, ids: body.ids });
      return false;
    }
    showErrorBanner({ error: 'stale', detail: 'Kept losing the race with a concurrent write — try again.' });
    return false;
  }

  function pruneToExisting(set) {
    const result = new Set();
    for (const id of set) if (findItem(graph, id)) result.add(id);
    return result;
  }

  // ---- errors ------------------------------------------------------------------
  function showErrorBanner(info) {
    const parts = [];
    if (info.status) parts.push(String(info.status));
    if (info.error) parts.push(info.error);
    let text = parts.join(' ');
    if (info.detail) text += (text ? ': ' : '') + info.detail;
    if (info.ids && info.ids.length) text += ' (' + info.ids.join(', ') + ')';
    errorBanner.textContent = text || 'The write was refused.';
    errorBanner.hidden = false;
  }
  function clearErrorBanner() { errorBanner.hidden = true; errorBanner.textContent = ''; }

  function showFatal(info) {
    let text;
    if (info.status === 404 || info.error === 'not-found') {
      text = 'This graph is gone — nothing exists at ' + currentPath + '.';
    } else if (info.network) {
      text = 'Lost the connection to the viewer server.';
    } else {
      text = [info.status, info.error, info.detail].filter(Boolean).join(' ') || 'Could not load this graph.';
    }
    fatalEl.textContent = text;
    fatalEl.hidden = false;
    svg.style.display = 'none';
  }
  function clearFatal() { fatalEl.hidden = true; svg.style.display = ''; }

  // ---- selection ---------------------------------------------------------------
  // Selecting both endpoints of an edge selects the edge (decision 63) so a
  // bulk verdict over a region covers the arrows inside it. Shift-clicking such
  // an implied edge removes it from the selection, and it stays removed only
  // for as long as both endpoints stay selected — the moment either endpoint
  // drops out, the suppression is meaningless and this clears it.
  function effectiveSelectionIds() {
    if (!graph) return new Set();
    const nodeIdsSelected = new Set([...selectedIds].filter(isNodeId));
    const result = new Set(selectedIds);
    for (const e of graph.edges) {
      const bothEnds = nodeIdsSelected.has(e.from) && nodeIdsSelected.has(e.to);
      if (bothEnds) {
        if (!impliedRemoved.has(e.id)) result.add(e.id);
      } else {
        impliedRemoved.delete(e.id);
      }
    }
    return result;
  }

  function pick(id, additive) {
    const isSel = effectiveSelectionIds().has(id);
    if (!additive) {
      selectedIds = new Set([id]);
      impliedRemoved = new Set();
    } else if (isSel) {
      selectedIds.delete(id);
      if (!isNodeId(id)) impliedRemoved.add(id);
    } else {
      selectedIds.add(id);
      impliedRemoved.delete(id);
    }
    render();
  }

  function clearSelection() { selectedIds = new Set(); impliedRemoved = new Set(); }

  document.getElementById('select-all').addEventListener('click', () => {
    if (!graph) return;
    selectedIds = new Set(graph.nodes.map((n) => n.id));
    impliedRemoved = new Set();
    render();
  });
  clearBtn.addEventListener('click', () => { clearSelection(); render(); });

  // ---- verdicts ------------------------------------------------------------------
  // §6: "A bulk verdict is additive only" — any number of entries may move *from*
  // `proposed`, and at most one may move *away from* an existing verdict, and the
  // server enforces that by diffing the write. A selection of two or more is always
  // a bulk gesture here, so it only ever touches unruled entries — an already-ruled
  // one sitting inside a select-all stays exactly as it was. A selection of exactly
  // one is the deliberate single reversal §6 carves out: it applies regardless of
  // what the item already carried, agreed/rejected included.
  function applyOrigin(g, ids, verdict) {
    const bulk = ids.length > 1;
    for (const id of ids) {
      const item = findNode(g, id) || findEdge(g, id);
      if (!item) continue;
      if (bulk && item.origin !== 'proposed') continue;
      if (item.origin !== verdict) {
        item.origin = verdict;
        // The page may only *clear* a `was`, and only in the same write that
        // changes that entry's origin — never set one, never touch it when
        // the origin does not change.
        item.was = null;
      }
    }
  }

  approveBtn.addEventListener('click', () => {
    const ids = [...effectiveSelectionIds()];
    if (!ids.length) return;
    putView((g) => applyOrigin(g, ids, 'agreed'));
  });
  rejectBtn.addEventListener('click', () => {
    const ids = [...effectiveSelectionIds()];
    if (!ids.length) return;
    putView((g) => applyOrigin(g, ids, 'rejected'));
  });

  function commitDrag(positions) {
    putView((g) => {
      for (const [id, pos] of positions) {
        const n = findNode(g, id);
        if (n) { n.x = pos.x; n.y = pos.y; }
      }
    });
  }

  // Fits the whole graph inside the current viewport, with a margin, and
  // centres it — a person should not have to pan before they can read it. Caps
  // at 1x rather than magnifying small graphs to fill empty space: the fix for
  // "jammed at the edge with room to spare" is centring, not enlarging.
  function fitToView() {
    if (!graph || !graph.nodes.length) { view = { x: 0, y: 0, k: 1 }; return; }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of graph.nodes) {
      const h = nodeHeight(n);
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + NODE_W); maxY = Math.max(maxY, n.y + h);
    }
    const margin = 60;
    const availW = Math.max(100, svg.clientWidth - margin * 2);
    const availH = Math.max(100, svg.clientHeight - margin * 2);
    const contentW = Math.max(1, maxX - minX), contentH = Math.max(1, maxY - minY);
    const fit = Math.min(availW / contentW, availH / contentH);
    const k = Math.max(MIN_ZOOM, Math.min(1, fit));
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    view = { k, x: svg.clientWidth / 2 - cx * k, y: svg.clientHeight / 2 - cy * k };
  }

  // ---- navigation ------------------------------------------------------------------
  async function loadGraph(path) {
    const result = await getGraph(path);
    if (!result.ok) { showFatal(result); return false; }
    currentPath = path;
    graph = result.graph;
    lastHash = result.hash;
    childrenMap = result.children;
    selectedIds = new Set();
    impliedRemoved = new Set();
    clearFatal(); clearErrorBanner();
    document.title = graph.title || 'graph viewer';
    syncExplainPanel();
    resizeCanvas();
    fitToView();
    render();
    return true;
  }

  function openChild(name) {
    if (childrenMap[name] === false) return;
    const childPath = dirnameOf(currentPath) + name + '.json';
    const parentEntry = { path: currentPath, title: (graph && graph.title) || currentPath };
    loadGraph(childPath).then((ok) => {
      if (ok) { trail.push(parentEntry); renderBreadcrumb(); }
    });
  }

  function stepBack() {
    if (!trail.length) return;
    const parent = trail.pop();
    loadGraph(parent.path).then((ok) => {
      if (!ok) trail.push(parent);
      renderBreadcrumb();
    });
  }

  function goToCrumb(path) {
    const idx = trail.findIndex((t) => t.path === path);
    const truncated = idx === -1 ? trail.slice() : trail.slice(0, idx);
    if (path === currentPath) return; // already here
    loadGraph(path).then((ok) => { if (ok) { trail = truncated; renderBreadcrumb(); } });
  }

  function renderBreadcrumb() {
    breadcrumbNav.innerHTML = '';
    const entries = trail.concat([{ path: currentPath, title: (graph && graph.title) || currentPath }]);
    for (const entry of entries) {
      const btn = document.createElement('button');
      btn.className = 'crumb';
      btn.setAttribute('data-path', entry.path);
      btn.textContent = entry.title;
      btn.addEventListener('click', () => goToCrumb(entry.path));
      breadcrumbNav.appendChild(btn);
    }
  }

  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape') return;
    // Escape clears a selection first if there is one, and only steps back out
    // of a container once there is nothing left to clear.
    if (effectiveSelectionIds().size) { clearSelection(); render(); }
    else stepBack();
  });

  // ---- explanation panel ------------------------------------------------------------------
  // Built here, not in the static markup, so a `null` explanation can mean "no panel at all" —
  // an element that merely sits `hidden` would still count as one to a DOM query, and the page
  // must never keep around an empty shell for a graph that carries no explanation.
  const explainPanel = document.createElement('div');
  explainPanel.id = 'explain-panel';
  const explainToggle = document.createElement('button');
  explainToggle.type = 'button';
  explainToggle.id = 'explain-toggle';
  explainToggle.innerHTML = '<span class="chevron">▾</span><span>explanation</span>';
  const explainBody = document.createElement('div');
  explainBody.id = 'explain-body';
  explainPanel.append(explainToggle, explainBody);
  explainToggle.addEventListener('click', () => setExplainExpanded(!explainExpanded));

  function setExplainExpanded(expanded) {
    explainExpanded = expanded;
    syncExplainPanel();
    if (graph) render();
  }

  // Adds or removes the panel from the document — never just hides it, see above — and syncs its
  // text and expanded/collapsed state to the current graph and `explainExpanded`. Called before
  // resizeCanvas everywhere resizeCanvas is called: resizeCanvas measures this element's real,
  // laid-out height to know where the canvas starts, so the DOM has to be settled first.
  function syncExplainPanel() {
    const text = graph && graph.explanation;
    if (text == null) {
      if (explainPanel.isConnected) explainPanel.remove();
      return;
    }
    if (!explainPanel.isConnected) topbar.insertAdjacentElement('afterend', explainPanel);
    explainBody.textContent = text;
    explainPanel.classList.toggle('collapsed', !explainExpanded);
    explainToggle.setAttribute('aria-expanded', String(explainExpanded));
    explainBody.hidden = !explainExpanded;
  }

  // ---- geometry ------------------------------------------------------------------
  // A box whose height never responds to its label keeps colliding with
  // something — the kind tag at a fixed offset from a box that stays a fixed
  // height, an edge trimmed to a box that isn't as tall as it looks. The
  // height is a function of how many lines the label actually wrapped to, and
  // everything downstream (the kind tag position, edge trimming, box-select
  // hit testing, fit-to-view) is computed from *this*, not from a constant.
  const FIRST_LINE_CHARS_WITH_BADGE = 16;
  function firstLineCap(n) { return n.graph !== null ? FIRST_LINE_CHARS_WITH_BADGE : 24; }
  function nodeHeight(n) {
    const lines = wrapText(n.label, 24, NODE_LABEL_MAX_LINES, firstLineCap(n)).length;
    return Math.max(NODE_H, 22 + (lines - 1) * 16 + 30);
  }

  // NODE_LABEL_MAX_LINES lines is as tall as a box gets, so a longer label loses its tail to
  // the ellipsis wrapText leaves behind — and the box becomes the one place the
  // sentence cannot be read. Both places that can show it in full (the hover
  // tooltip below, and the selection panel) key off this rather than sniffing
  // for a trailing ellipsis, which a label that genuinely ends in one would
  // trip on its own.
  function labelTruncated(n) {
    const shown = wrapText(n.label, 24, NODE_LABEL_MAX_LINES, firstLineCap(n)).join(' ');
    const full = String(n.label == null ? '' : n.label).split(/\s+/).filter(Boolean).join(' ');
    return shown !== full;
  }

  function rectOverlapsAny(rect, nodes, excludeIds) {
    for (const n of nodes) {
      if (excludeIds.includes(n.id)) continue;
      const h = nodeHeight(n);
      if (rect.x < n.x + NODE_W && rect.x + rect.w > n.x &&
          rect.y < n.y + h && rect.y + rect.h > n.y) return true;
    }
    return false;
  }

  function rectsOverlap(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
  }

  function rectExit(cx, cy, hw, hh, sx, sy) {
    if (!sx && !sy) return [cx, cy];
    const t = Math.min(
      Math.abs(sx) > 1e-6 ? (hw + 4) / Math.abs(sx) : Infinity,
      Math.abs(sy) > 1e-6 ? (hh + 4) / Math.abs(sy) : Infinity
    );
    return [cx + sx * t, cy + sy * t];
  }

  // Measured once per distinct label string and cached forever, rather than re-measured on every
  // render: render() runs on every pointermove during a drag, a pan and a marquee, and a graph
  // crowded enough to need real measurement is exactly the graph where redoing it every one of
  // those frames would cost the most. The element that does the measuring does not survive a
  // render — render() clears the whole canvas — so it is re-created there (see render()); only
  // the cache has to survive, and it lives at module scope so it does.
  const labelWidthCache = new Map();
  let labelMetricEl = null;

  function measureLabelWidth(text) {
    if (labelWidthCache.has(text)) return labelWidthCache.get(text);
    labelMetricEl.textContent = text;
    const w = labelMetricEl.getComputedTextLength();
    labelWidthCache.set(text, w);
    return w;
  }

  // Liang-Barsky segment-vs-rect clip test: whether any part of the segment (x1,y1)-(x2,y2) falls
  // inside rect. Used to decide whether an edge label needs a leader line back to its own arrow —
  // there is no fixed distance threshold for that, because whether a label's box happens to touch
  // its line depends on the label's measured width and the line's angle, both of which vary from
  // edge to edge.
  function rectIntersectsSegment(rect, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const p = [-dx, dx, -dy, dy];
    const q = [x1 - rect.x, rect.x + rect.w - x1, y1 - rect.y, rect.y + rect.h - y1];
    let tMin = 0, tMax = 1;
    for (let i = 0; i < 4; i += 1) {
      if (p[i] === 0) {
        if (q[i] < 0) return false;
        continue;
      }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > tMax) return false; if (t > tMin) tMin = t; }
      else { if (t < tMin) return false; if (t < tMax) tMax = t; }
    }
    return tMin <= tMax;
  }

  // Nearest point on the segment (x1,y1)-(x2,y2) to (px,py) — the leader line's far end, so it
  // points at the closest part of the edge's own line rather than one of its fixed ends.
  function closestPointOnSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const lenSq = dx * dx + dy * dy || 1;
    let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    return [x1 + dx * t, y1 + dy * t];
  }

  function buildMarkerDefs() {
    const defs = el('defs');
    for (const origin of ['proposed', 'agreed', 'rejected']) {
      const marker = el('marker', {
        id: 'arrow-' + origin, viewBox: '0 0 10 10', refX: 9, refY: 5,
        markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse',
      });
      const colorVar = { proposed: 'var(--proposed)', agreed: 'var(--agreed)', rejected: 'var(--rejected)' }[origin];
      marker.appendChild(el('path', { d: 'M0,0 L10,5 L0,10 Z', fill: colorVar }));
      defs.appendChild(marker);
    }
    return defs;
  }

  function renderNodeGroup(root, n, effSel) {
    const selected = effSel.has(n.id);
    const cls = ['node'];
    if (selected) cls.push('selected');
    if (n.origin === 'rejected') cls.push('rejected');
    if (n.origin === 'agreed') cls.push('agreed');
    const attrs = {
      class: cls.join(' '), 'data-id': n.id, 'data-origin': n.origin, 'data-kind': n.kind,
      transform: 'translate(' + n.x + ',' + n.y + ')',
    };
    if (n.exclusive) attrs['data-exclusive'] = 'true';
    const missing = n.graph !== null && childrenMap[n.graph] === false;
    if (missing) attrs['data-child-missing'] = 'true';
    if (n.was) attrs['data-was'] = n.was;
    const g = el('g', attrs);

    const h = nodeHeight(n);

    // Reading the whole label shouldn't cost a click. A native tooltip on the
    // box carries the untruncated text at any zoom, and is added only where the
    // box is actually hiding something — a tooltip echoing text already on
    // screen is noise on every other node.
    if (labelTruncated(n)) {
      const tip = el('title');
      tip.textContent = n.label;
      g.appendChild(tip);
    }

    g.appendChild(el('rect', { class: 'node-box', width: NODE_W, height: h, rx: 6 }));

    // §6: an agent may reset an entry Collin approved back to `proposed`,
    // recording `was` on it. Rendered identically to a never-ruled entry it is
    // indistinguishable from one nobody has looked at — this quiet dot in the
    // corner opposite the open-child badge is the only place a person can see
    // the difference. It disappears the moment the person rules again, which
    // already clears `was` (see applyOrigin).
    if (n.was) {
      const mark = el('circle', { class: 'was-mark', cx: 8, cy: 8, r: 3 });
      const tip = el('title');
      tip.textContent = 'Reset by an agent — was ' + n.was;
      mark.appendChild(tip);
      g.appendChild(mark);
    }

    // A container's open/missing badge sits in the top-right corner. Left at
    // the default wrap width, the first line of a long label runs under it —
    // the badge painted over the text rather than beside it. Reserving fewer
    // characters on the first line alone (subsequent lines still use the full
    // width) keeps the label clear of the badge without touching its position.
    const lines = wrapText(n.label, 24, NODE_LABEL_MAX_LINES, firstLineCap(n));
    lines.forEach((line, i) => {
      const t = el('text', { class: 'node-label', x: 12, y: 22 + i * 16 });
      t.textContent = line;
      g.appendChild(t);
    });

    const kindTag = el('text', { class: 'node-kind', x: 12, y: h - 8 });
    kindTag.textContent = n.kind;
    g.appendChild(kindTag);

    if (n.exclusive) {
      const fork = el('text', { class: 'node-fork', x: NODE_W - 12, y: h - 8, 'text-anchor': 'end' });
      fork.textContent = 'fork';
      g.appendChild(fork);
    }

    if (n.graph !== null) {
      const badge = el('g', {
        class: 'open-child' + (missing ? ' disabled' : ''), 'data-graph': n.graph,
        transform: 'translate(' + (NODE_W - 58) + ',6)',
      });
      badge.appendChild(el('rect', { width: 50, height: 16, rx: 3, class: 'open-child-bg' }));
      const label = el('text', { class: 'open-child-label', x: 25, y: 11, 'text-anchor': 'middle' });
      label.textContent = missing ? 'missing' : 'open ›';
      badge.appendChild(label);
      if (missing) {
        const tip = el('title');
        tip.textContent = 'child graph "' + n.graph + '" does not exist';
        badge.appendChild(tip);
      } else {
        badge.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        badge.addEventListener('pointerup', (ev) => { ev.stopPropagation(); openChild(n.graph); });
      }
      g.appendChild(badge);
    }

    g.addEventListener('pointerdown', (ev) => startNodeDrag(ev, n));
    root.appendChild(g);
  }

  function renderEdgeGroup(root, labelLayer, e, a, b, pairIndex, pairCount, effSel, nodeBoxRects, labelRects) {
    const selected = effSel.has(e.id);
    const cls = ['edge'];
    if (selected) cls.push('selected');
    if (e.origin === 'rejected') cls.push('rejected');
    if (e.origin === 'agreed') cls.push('agreed');
    const attrs = { class: cls.join(' '), 'data-id': e.id, 'data-origin': e.origin, 'data-kind': e.kind };
    if (e.was) attrs['data-was'] = e.was;
    const g = el('g', attrs);

    // Each endpoint's own actual height (see nodeHeight): a box whose height
    // grew to fit a wrapped label still has to trim edges at *its* boundary,
    // not a shared constant that no longer matches it.
    const ha = nodeHeight(a), hb = nodeHeight(b);
    const x1 = a.x + NODE_W / 2, y1 = a.y + ha / 2;
    const x2 = b.x + NODE_W / 2, y2 = b.y + hb / 2;
    const dx = x2 - x1, dy = y2 - y1;

    // Trim to where the line crosses the node's rectangle, not a fixed radius
    // from its centre — a radius trim buries the line end and the arrowhead
    // under the box.
    let [ax, ay] = rectExit(x1, y1, NODE_W / 2, ha / 2, dx, dy);
    let [bx, by] = rectExit(x2, y2, NODE_W / 2, hb / 2, -dx, -dy);

    // Two edges on one pair of nodes — including opposite directions — land on
    // the same line and read as a single double-headed arrow. Fan them apart
    // perpendicular to the line so each is separate geometry and independently
    // hittable. The perpendicular has to come from a direction shared by both
    // edges of the pair, not each edge's own dx/dy: for e->f and f->e those are
    // exact opposites, so an index-based offset computed from each edge's own
    // direction flips sign right along with it and cancels out — both edges
    // landed on identical geometry. Canonicalizing on the same sorted-pair
    // order used for pairKey fixes the basis so the index actually separates them.
    const pairKey = JSON.stringify([e.from, e.to].slice().sort());
    const n = pairCount.get(pairKey) || 1;
    if (n > 1) {
      const canonSign = e.from < e.to ? 1 : -1;
      const cdx = dx * canonSign, cdy = dy * canonSign;
      const L0 = Math.hypot(cdx, cdy) || 1;
      const shift = (pairIndex.get(e.id) - (n - 1) / 2) * 14;
      ax += (-cdy / L0) * shift; ay += (cdx / L0) * shift;
      bx += (-cdy / L0) * shift; by += (cdx / L0) * shift;
    }

    const d = 'M' + ax + ',' + ay + ' L' + bx + ',' + by;
    g.appendChild(el('path', { class: 'edge-line', d, 'marker-end': 'url(#arrow-' + e.origin + ')' }));

    // The hit band is 24 *device* pixels at any zoom. The band's own
    // stroke-width lives inside the pan/zoom transform, so to land on 24
    // device pixels the local (pre-scale) width must be 24/zoom — 24 raw
    // local units would be about 8 device px at the 0.3 zoom floor, worse than
    // the ~14px gap that made the line unhittable in the first place. Recomputed
    // on every render, so it tracks the current zoom.
    const band = el('path', { class: 'edge-band', d, 'stroke-width': String(24 / view.k) });
    band.addEventListener('pointerdown', (ev) => ev.stopPropagation());
    band.addEventListener('pointerup', (ev) => { ev.stopPropagation(); pick(e.id, ev.shiftKey); });
    g.appendChild(band);

    const ends = [['from', ax, ay], ['to', bx, by]];
    for (const [end, hx, hy] of ends) {
      const handle = el('circle', { class: 'edge-handle', 'data-end': end, cx: hx, cy: hy, r: 5 });
      handle.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      handle.addEventListener('pointerup', (ev) => { ev.stopPropagation(); pick(e.id, ev.shiftKey); });
      g.appendChild(handle);
    }

    root.appendChild(g);

    // A fork's outgoing edges are the one place shape carries meaning: each
    // arm reads "if <label>" plus its payload where it has one, because
    // without that a graph cannot distinguish "then both" from "then either".
    const isForkArm = a.exclusive === true;
    const payload = (e.kind === 'data' && e.value) ? e.value : null;
    const text = isForkArm ? ('if ' + e.label + (payload ? ': ' + payload : '')) : e.label;

    // Offset perpendicular to the line, clear of both node boxes, instead of
    // centred on it — a centred label lands inside whichever box the gap is
    // too narrow for. Everything the label draws now lives in labelLayer, a
    // single <g> appended once after every edge group (see render()), rather
    // than inside this edge's own g.edge: appending per-edge just moved the
    // over-painting this whole change fixes rather than removing it, since a
    // later edge's g.edge would still land after an earlier edge's label in
    // DOM order and paint over it, only ordered by graph.edges instead of
    // incidentally.
    //
    // A fixed offset only clears the *line's own* two nodes. Two arms leaving
    // one node at similar angles still land close together regardless of the
    // constant, because neither knows the other exists, and a third box in the
    // way knows nothing about either. Rather than guess a bigger constant —
    // which just moves the collision to the next graph — search: try spots
    // nearest the natural one first, take the first that hits nothing already
    // placed, and settle for the natural one if nothing is clear.
    //
    // The spots cover both ways a label can move and still belong to its own arrow. Sideways off
    // the line, alternating sides, so it never walks off in one direction. And along the line away
    // from the midpoint, because sideways alone cannot save an arrow that crosses two rows: its
    // midpoint sits inside the row in between, where every sideways step lands on another box,
    // while a quarter of the way toward either end is clear air between rows.
    const L2 = Math.hypot(dx, dy) || 1;
    const measured = measureLabelWidth(text);
    const width = Math.max(24, measured + 14);
    const rectAt = (p) => ({ x: p.x - width / 2, y: p.y - 15, w: width, h: 18 });

    // The ladder starts at 0 — right on the line — rather than half a box-height off it. That
    // half-box-height (the old baseOff) existed only so a centred label wouldn't land inside a
    // node box, and seeding the search with every box (nodeBoxRects, below) already made the
    // search reject those spots on its own; keeping baseOff on top of that just guaranteed no
    // label could ever land on its own arrow, which is the exact ambiguity this change exists to
    // remove. Runs to 144 rather than 80 so the ladder still reaches as far off the line as it
    // used to (baseOff + 80 was 133-138 for this graph's box heights) now that baseOff is gone —
    // a shorter ladder would trade that reach for less search room.
    const spots = [];
    for (let off = 0; off <= 144; off += 16) {
      for (const along of [0.5, 0.36, 0.64, 0.24, 0.76]) {
        if (off === 0) { spots.push([along, 0]); continue; } // one spot: +0 and -0 name the same point
        spots.push([along, off]);
        spots.push([along, -off]);
      }
    }
    const points = spots.map(([along, off]) => ({
      x: ax + (bx - ax) * along + (dy / L2) * off,
      y: ay + (by - ay) * along - (dx / L2) * off,
    }));

    // Two-tier fallback: overlapping another label is recoverable — it still gets a leader line
    // back to its arrow, below — but sitting on a box's own words is not, so a spot that only
    // clears the boxes beats giving up outright. The last resort, points[0] (along=0.5, off=0),
    // is the plain segment midpoint — wrong for exactly the case it fires on most, a row-skipping
    // edge, whose midpoint sits inside the row it's skipping over, which is the same box collision
    // that seeding the search with every box was added to prevent in the first place.
    const clearsBoxes = (r) => !nodeBoxRects.some((box) => rectsOverlap(r, box));
    const clearsAll = (r) => clearsBoxes(r) && !labelRects.some((box) => rectsOverlap(r, box));
    const spot = points.find((p) => clearsAll(rectAt(p)))
      || points.find((p) => clearsBoxes(rectAt(p)))
      || points[0];
    const { x: mx, y: my } = spot;
    const labelRect = rectAt(spot);
    labelRects.push(labelRect);

    const labelClass = ['edge-label'];
    if (selected) labelClass.push('selected');
    if (e.origin === 'rejected') labelClass.push('rejected');
    if (e.origin === 'agreed') labelClass.push('agreed');

    // Drawn first, same ordering as detail-leader further down, so its dashes never cross the
    // label's own opaque background — only when the label actually landed somewhere its rectangle
    // doesn't already touch its own line; a label sitting on its line needs nothing pointing back
    // to it.
    if (!rectIntersectsSegment(labelRect, ax, ay, bx, by)) {
      const [lx, ly] = closestPointOnSegment(mx, my, ax, ay, bx, by);
      const leaderClass = ['edge-leader'];
      if (e.origin === 'rejected') leaderClass.push('rejected');
      if (e.origin === 'agreed') leaderClass.push('agreed');
      labelLayer.appendChild(el('line', {
        class: leaderClass.join(' '), 'data-id': e.id, x1: mx, y1: my, x2: lx, y2: ly,
      }));
    }

    const labelBg = el('rect', {
      class: 'edge-label-bg', 'data-id': e.id, x: mx - width / 2, y: my - 15, width, height: 18, rx: 3,
    });
    const label = el('text', { class: labelClass.join(' '), 'data-id': e.id, x: mx, y: my - 2 });
    label.textContent = text;
    for (const part of [labelBg, label]) {
      part.addEventListener('pointerdown', (ev) => ev.stopPropagation());
      part.addEventListener('pointerup', (ev) => { ev.stopPropagation(); pick(e.id, ev.shiftKey); });
      // Hovering the label used to reveal these same endpoint handles for free, by CSS :hover on
      // the ancestor g.edge (see the comment on .edge:hover above). Now that the label lives
      // outside that group, it has to toggle the stand-in class on `g` itself.
      part.addEventListener('pointerenter', () => g.classList.add('label-hover'));
      part.addEventListener('pointerleave', () => g.classList.remove('label-hover'));
    }
    labelLayer.appendChild(labelBg);
    labelLayer.appendChild(label);

    // Same quiet marker as a node's (see renderNodeGroup): a dot at the label's
    // corner, present only while `was` is set, gone the moment the edge is
    // ruled on again. It comes into the label layer with everything else drawn
    // from this label's geometry: left behind in g.edge it would go from
    // painted-last to buried under any later edge's line, and it is the only
    // place a reader can see that an agent reset an edge.
    if (e.was) {
      const mark = el('circle', { class: 'was-mark', 'data-id': e.id, cx: mx - width / 2, cy: my - 15, r: 3 });
      const tip = el('title');
      tip.textContent = 'Reset by an agent — was ' + e.was;
      mark.appendChild(tip);
      labelLayer.appendChild(mark);
    }
  }

  function renderDetail(root, id, nodeById) {
    const node = findNode(graph, id);
    const item = node || findEdge(graph, id);
    if (!item) return;

    const fields = [];
    // First, above ref and note: it is the field the box failed to show, so it
    // is what the panel was opened to read. Given more lines than the others
    // because it is the one field with no length ceiling anywhere upstream.
    if (node && labelTruncated(node)) fields.push(['detail-label', node.label, 12]);
    if (item.ref) fields.push(['detail-ref', item.ref]);
    if (item.note) fields.push(['detail-note', item.note]);
    if (!node && item.value) {
      fields.push(['detail-value', item.value]);
      fields.push(['detail-inferred', item.inferred ? 'inferred — not stated by the source' : 'stated by the source']);
    }
    // The group itself exists whenever exactly one item is selected, even with
    // nothing to expand — only the per-field elements are conditionally
    // omitted, never left present-but-empty.

    // The panel's height has to be known *before* choosing where it goes: it
    // expands at the item by design, but expanding blindly downward buries
    // whatever sits below — another node in the row underneath, or a nearby
    // edge label. Measure the wrapped content first, then pick whichever side
    // (below, or above) doesn't land on another node.
    // Matches the actual <rect class="detail-bg"> built below exactly: local
    // y=-4, height=cursorY. A collision box that doesn't match those two
    // numbers checks the wrong rectangle and can pass a placement that the
    // real, slightly-offset box still overlaps by the difference.
    const panelW = 210;
    let panelH = 0;
    if (fields.length) {
      let cursor = 18;
      for (const [, raw, maxLines] of fields) cursor += wrapText(raw, 32, maxLines || 4).length * 14 + 6;
      panelH = cursor;
    }
    const panelTopOffset = 4;

    let x, belowY, aboveY, excludeIds, anchor;
    if (node) {
      const h = nodeHeight(node);
      x = node.x;
      belowY = node.y + h + 12;
      aboveY = node.y - panelH - 12;
      excludeIds = [node.id];
      anchor = { x: node.x + NODE_W / 2, y: node.y + h / 2 };
    } else {
      const a = nodeById.get(item.from), b = nodeById.get(item.to);
      if (!a || !b) return;
      const ha = nodeHeight(a), hb = nodeHeight(b);
      x = Math.min(a.x, b.x) + NODE_W / 2 - 105;
      belowY = Math.max(a.y + ha, b.y + hb) + 34;
      aboveY = Math.min(a.y, b.y) - panelH - 22;
      excludeIds = [a.id, b.id];
      anchor = { x: (a.x + b.x) / 2 + NODE_W / 2, y: (a.y + ha / 2 + b.y + hb / 2) / 2 };
    }

    // A single flip to the opposite side isn't enough on its own: the node
    // above (or below) an edge's two endpoints isn't necessarily clear either,
    // and a fixed jump can still land on a *third* node further along in that
    // direction. Search outward in steps on each side and take whichever
    // clears in fewer of them. This step-search is a nudge, not a corridor to
    // empty canvas: it stays attached to the item, so it is bounded to two
    // steps (~48 user units) each way. If neither side clears inside that
    // bound, the panel goes to its natural adjacent position (belowY) anyway
    // and is marked `overlapping`, which the CSS above turns into a visibly
    // layered panel instead of a silently buried one.
    const STEP = 24, STEP_LIMIT = 2;
    function firstClear(startY, step) {
      if (!panelH) return { y: startY, steps: 0 };
      for (let i = 0; i <= STEP_LIMIT; i += 1) {
        const y = startY + i * step;
        const box = { x, y: y - panelTopOffset, w: panelW, h: panelH };
        if (!rectOverlapsAny(box, graph.nodes, excludeIds)) return { y, steps: i };
      }
      return null;
    }
    const below = firstClear(belowY, STEP);
    const above = firstClear(aboveY, -STEP);
    let y, overlapping;
    if (below && (!above || below.steps <= above.steps)) { y = below.y; overlapping = false; }
    else if (above) { y = above.y; overlapping = false; }
    else { y = belowY; overlapping = true; }

    const g = el('g', {
      class: 'detail' + (overlapping ? ' overlapping' : ''), 'data-for': id,
      transform: 'translate(' + x + ',' + y + ')',
    });
    let cursorY = 18;
    const textEls = [];
    for (const [cls, raw, maxLines] of fields) {
      const t = textWithWrap(cls, 10, raw, 32, maxLines || 4);
      t.setAttribute('y', String(cursorY));
      textEls.push(t);
      cursorY += t._lineCount * 14 + 6;
    }
    if (fields.length) {
      // Forced onto whatever it overlaps — a short leader line back to the
      // selected item keeps the association legible even where the panel
      // itself is no longer sitting in obviously-empty space. Drawn first (so
      // the opaque background below paints over the segment that crosses the
      // panel) and clamped to the panel's own rect, so it reads as pointing
      // from the item to this panel rather than as a stray line.
      if (overlapping) {
        const rx0 = 0, rx1 = panelW, ry0 = -panelTopOffset, ry1 = -panelTopOffset + cursorY;
        const lx = anchor.x - x, ly = anchor.y - y;
        const cx = Math.max(rx0, Math.min(rx1, lx)), cy = Math.max(ry0, Math.min(ry1, ly));
        if (cx !== lx || cy !== ly) {
          g.appendChild(el('line', { class: 'detail-leader', x1: lx, y1: ly, x2: cx, y2: cy }));
        }
      }
      g.appendChild(el('rect', { class: 'detail-bg', x: 0, y: -panelTopOffset, width: panelW, height: cursorY, rx: 6 }));
    }
    for (const t of textEls) g.appendChild(t);
    root.appendChild(g);
  }

  function renderControlsState(effSel) {
    const has = effSel.size > 0;
    approveBtn.disabled = !has;
    rejectBtn.disabled = !has;
    clearBtn.disabled = !has;

    // A bulk selection (two or more) only rules on the unruled — an already-ruled
    // entry caught inside a select-all is left exactly as it was. Say so on the
    // button, but only when it's actually true of the current selection, so a
    // plain single or all-unruled selection isn't cluttered with a caveat that
    // doesn't apply to it.
    let hint = '';
    if (effSel.size > 1 && graph) {
      const alreadyRuled = [...effSel].some((id) => {
        const item = findItem(graph, id);
        return item && item.origin !== 'proposed';
      });
      if (alreadyRuled) hint = 'Applies only to unruled items — existing verdicts are left alone.';
    }
    approveBtn.title = hint;
    rejectBtn.title = hint;
  }

  function resizeCanvas() {
    // Same lesson as the CSS comment above: the height has to be set as an
    // explicit pixel attribute, computed fresh on every layout change, or the
    // <svg> collapses to its 150px intrinsic size.
    //
    // The explanation panel is a second thing, besides the topbar, that pushes the canvas's top
    // edge down — measured the same way, off its own real layout box, not a constant, since it
    // has a different height expanded than collapsed and isn't there at all when there's no
    // explanation. Skipping this measurement is exactly the bug the layout inventory in the plan
    // warns about: the canvas would keep starting at the topbar's bottom edge and its top strip
    // would sit buried under the panel.
    const top = topbar.getBoundingClientRect().height || 48;
    const panelH = explainPanel.isConnected ? explainPanel.getBoundingClientRect().height : 0;
    const canvasTop = top + panelH;
    const h = Math.max(200, window.innerHeight - canvasTop);
    const w = window.innerWidth;
    svg.setAttribute('width', String(w));
    svg.setAttribute('height', String(h));
    svg.style.top = canvasTop + 'px';
  }

  function render() {
    if (!graph) return;
    syncExplainPanel();
    resizeCanvas();
    svg.setAttribute('data-zoom', String(view.k));
    sourceEl.textContent = graph.source + (graph.source_detail ? ' · ' + graph.source_detail : '');

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(buildMarkerDefs());

    // Recreated on every render because the clear above just destroyed the last one — this
    // element is never assumed to survive it. What has to survive is labelWidthCache (declared at
    // module scope, beside measureLabelWidth): a label string measured on an earlier render is
    // still a cache hit even though the <text> that produced that measurement is long gone.
    labelMetricEl = el('text', { class: 'label-metric' });
    svg.appendChild(labelMetricEl);

    const root = el('g', { transform: 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')' });
    svg.appendChild(root);

    const pairIndex = new Map(), pairCount = new Map();
    for (const e of graph.edges) {
      // JSON.stringify of the sorted pair, not a joined string: ids are only
      // guaranteed unique within their own collection, not free of whatever
      // separator a plain join would pick, so a delimiter-free key is the only
      // one that can't collide.
      const key = JSON.stringify([e.from, e.to].slice().sort());
      pairIndex.set(e.id, pairCount.get(key) || 0);
      pairCount.set(key, (pairCount.get(key) || 0) + 1);
    }
    const nodeById = new Map(graph.nodes.map((n) => [n.id, n]));
    const effSel = effectiveSelectionIds();

    // Nodes first, edges after: edges are trimmed to each box's boundary, so
    // painting them second never buries a box's own content.
    for (const n of graph.nodes) renderNodeGroup(root, n, effSel);
    // Seeded with every box before any edge label is placed: a label landing on a node is the
    // same collision as two labels landing on each other, just against a fixed element instead
    // of another label, and it is the worse of the two — it hides a box's own words, which are
    // the ones carrying the answer. Whole boxes, so this covers a fork's tag as well: the tag is
    // drawn inside its box, and it is the one place shape itself means something. Kept separate
    // from labelRects below because the two-tier fallback in renderEdgeGroup treats them
    // differently: clearing every box is required even in the fallback tier, clearing another
    // label is not.
    const nodeBoxRects = graph.nodes.map((n) => ({ x: n.x, y: n.y, w: NODE_W, h: nodeHeight(n) }));
    const labelRects = [];
    // Every label's own geometry — its text, background, was-mark and leader line — is appended
    // here instead of into each edge's own g.edge, and this single <g> is appended once, after
    // every edge group below, rather than interleaved with them: appending a label right after its
    // own edge would still leave it under whichever *later* edge's g.edge the DOM happens to place
    // after it (graph.edges order, not paint intent), which is the same over-painting this whole
    // change exists to fix, just moved rather than removed. Painting the whole layer last means no
    // edge's line, regardless of that order, can ever cross a label that isn't its own.
    const labelLayer = el('g', { class: 'label-layer' });
    for (const e of graph.edges) {
      const a = nodeById.get(e.from), b = nodeById.get(e.to);
      if (!a || !b) continue;
      renderEdgeGroup(root, labelLayer, e, a, b, pairIndex, pairCount, effSel, nodeBoxRects, labelRects);
    }
    root.appendChild(labelLayer);

    if (effSel.size === 1) renderDetail(root, [...effSel][0], nodeById);
    renderControlsState(effSel);
  }

  window.addEventListener('resize', () => { if (graph) render(); });

  // ---- pointer gestures ------------------------------------------------------------------
  let dragState = null;
  let panState = null;
  let marqueeState = null;

  function svgLocal(ev) {
    const r = svg.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function startNodeDrag(ev, n) {
    ev.stopPropagation();
    const already = effectiveSelectionIds().has(n.id);
    const ids = already ? [...effectiveSelectionIds()].filter(isNodeId) : [n.id];
    const start = new Map();
    for (const id of ids) {
      const node = findNode(graph, id);
      start.set(id, { x: node.x, y: node.y });
    }
    dragState = { primary: n.id, ids, start, x0: ev.clientX, y0: ev.clientY, moved: false };
    svg.setPointerCapture(ev.pointerId);
  }

  svg.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.node') || ev.target.closest('.edge')) return;
    // Pan is alt-drag or the middle button; the plain background drag is
    // selection (box-select), so the two never collide.
    if (ev.altKey || ev.button === 1) {
      panState = { x0: view.x, y0: view.y, cx: ev.clientX, cy: ev.clientY };
      svg.classList.add('panning');
    } else {
      const p = svgLocal(ev);
      marqueeState = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, shift: ev.shiftKey };
    }
    svg.setPointerCapture(ev.pointerId);
  });

  svg.addEventListener('pointermove', (ev) => {
    if (dragState) {
      if (!dragState.moved && Math.hypot(ev.clientX - dragState.x0, ev.clientY - dragState.y0) > 3) {
        dragState.moved = true;
      }
      if (dragState.moved) {
        const wdx = (ev.clientX - dragState.x0) / view.k;
        const wdy = (ev.clientY - dragState.y0) / view.k;
        for (const id of dragState.ids) {
          const node = findNode(graph, id);
          const s = dragState.start.get(id);
          node.x = s.x + wdx; node.y = s.y + wdy;
        }
        render();
      }
    } else if (panState) {
      view.x = panState.x0 + (ev.clientX - panState.cx);
      view.y = panState.y0 + (ev.clientY - panState.cy);
      render();
    } else if (marqueeState) {
      const p = svgLocal(ev);
      marqueeState.x1 = p.x; marqueeState.y1 = p.y;
      render(); drawMarquee();
    }
  });

  svg.addEventListener('pointerup', (ev) => {
    if (dragState) {
      if (dragState.moved) {
        const positions = [];
        for (const id of dragState.ids) {
          const node = findNode(graph, id);
          node.x = Math.round(node.x); node.y = Math.round(node.y);
          positions.push([id, { x: node.x, y: node.y }]);
        }
        render();
        commitDrag(positions);
      } else {
        // setPointerCapture above retargets the click that would otherwise
        // follow this pointerup to whatever happens to be under the pointer
        // when it is released — not reliably the node — so selection can
        // never be driven by "click". It fires here, on pointerup, and a drag
        // is distinguished from a plain selection purely by whether the
        // pointer moved past the small threshold above.
        pick(dragState.primary, ev.shiftKey);
      }
      dragState = null;
    } else if (panState) {
      panState = null;
      svg.classList.remove('panning');
    } else if (marqueeState) {
      finishMarquee(marqueeState, ev.shiftKey);
      marqueeState = null;
      render();
    }
  });

  function finishMarquee(m, shift) {
    const w = Math.abs(m.x1 - m.x0), h = Math.abs(m.y1 - m.y0);
    if (w < 4 && h < 4) {
      if (!shift) clearSelection();
      return;
    }
    const bx = Math.min(m.x0, m.x1), by = Math.min(m.y0, m.y1);
    if (!shift) { selectedIds = new Set(); impliedRemoved = new Set(); }
    for (const n of graph.nodes) {
      const sx = n.x * view.k + view.x, sy = n.y * view.k + view.y;
      const sw = NODE_W * view.k, sh = nodeHeight(n) * view.k;
      if (sx < bx + w && sx + sw > bx && sy < by + h && sy + sh > by) selectedIds.add(n.id);
    }
  }

  function drawMarquee() {
    if (!marqueeState) return;
    svg.appendChild(el('rect', {
      id: 'marquee',
      x: Math.min(marqueeState.x0, marqueeState.x1),
      y: Math.min(marqueeState.y0, marqueeState.y1),
      width: Math.abs(marqueeState.x1 - marqueeState.x0),
      height: Math.abs(marqueeState.y1 - marqueeState.y0),
    }));
  }

  function zoomBy(factor, clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const px = (clientX != null ? clientX : r.left + r.width / 2) - r.left;
    const py = (clientY != null ? clientY : r.top + r.height / 2) - r.top;
    const k = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, view.k * factor));
    view.x = px - (px - view.x) * (k / view.k);
    view.y = py - (py - view.y) * (k / view.k);
    view.k = k;
    render();
  }

  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    zoomBy(ev.deltaY < 0 ? 1.1 : 1 / 1.1, ev.clientX, ev.clientY);
  }, { passive: false });

  document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.2));
  document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.2));

  // ---- polling ------------------------------------------------------------------
  // Reload when the content hash differs from the last one this page read or
  // wrote; never on the page's own write, since that write already updated
  // `lastHash` to match. A drag in flight when an agent writes mid-poll is
  // lost — an accepted risk, not a bug to route around.
  async function pollOnce() {
    if (!currentPath) return;
    const result = await getGraph(currentPath);
    if (!result.ok) {
      if (result.status === 404) { showFatal(result); return; }
      pollStatus.hidden = false;
      pollStatus.textContent = 'lost contact with the viewer server — retrying…';
      return;
    }
    pollStatus.hidden = true;
    if (result.hash !== lastHash) {
      graph = result.graph;
      lastHash = result.hash;
      childrenMap = result.children;
      selectedIds = pruneToExisting(selectedIds);
      impliedRemoved = pruneToExisting(impliedRemoved);
      render();
    }
  }

  // ---- boot ------------------------------------------------------------------
  (async function init() {
    resizeCanvas();
    const ok = await loadGraph(currentPath);
    if (ok) renderBreadcrumb();
    setInterval(pollOnce, POLL_MS);
  })();

  // Read-only: the browser suite drives real pointer gestures and only reads
  // state back through this.
  window.__viewer = {
    get hash() { return lastHash; },
    get zoom() { return view.k; },
    get explainExpanded() { return explainExpanded; },
    selection() { return [...effectiveSelectionIds()]; },
    graph() { return graph; },
  };
})();
</script>
